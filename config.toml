# Production URL of the site (CloudFront / custom domain). No trailing slash.
base_url = "https://s2il.org"
title = "S2IL: Scalable Scientific Imaging Lab"
description = "From images to quantitative insights"
default_language = "en"

compile_sass = true
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]

taxonomies = [
  { name = "tags", feed = true },
]

[markdown]
smart_punctuation = true
external_links_target_blank = true

[extra]
# Main navigation (order matters)
menu = [
  { name = "Overview",     url = "/" },
  { name = "Projects",     url = "/projects/" },
  { name = "Publications", url = "/publications/" },
  { name = "News",         url = "/news/" },
  { name = "People",       url = "/people/" },
  { name = "Contact",      url = "/contact/" },
]
school = "School of Data Science"
institution = "University of Virginia"
email = ""
