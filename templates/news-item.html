{% extends "base.html" %}
{% block content %}
<article class="prose">
  <p class="breadcrumb"><a href="{{ get_url(path='/news/') }}">← News</a></p>
  <h1>{{ page.title }}</h1>
  <p class="date"><time datetime="{{ page.date }}">{{ page.date | date(format="%B %d, %Y") }}</time>
  {% if page.taxonomies.tags %} · {% for t in page.taxonomies.tags %}<a class="tag" href="{{ get_taxonomy_url(kind='tags', name=t) }}">#{{ t }}</a> {% endfor %}{% endif %}</p>
  {{ page.content | safe }}
</article>
{% endblock %}
