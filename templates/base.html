<!DOCTYPE html>
<html lang="{{ config.default_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% if page?.title %}{{ page.title }} · {% elif section?.title and section.path != "/" %}{{ section.title }} · {% endif %}{{ config.title | replace(from="S2IL", to="S²IL") }}{% endblock %}</title>
  <meta name="description" content="{% if page?.description %}{{ page.description }}{% else %}{{ config.description | replace(from="S2IL", to="S²IL") }}{% endif %}">
  <link rel="stylesheet" href="{{ get_url(path='style.css', cachebust=true) | replace(from=config.base_url, to='') }}">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title | replace(from="S2IL", to="S²IL") }}" href="{{ get_url(path='atom.xml', trailing_slash=false) | replace(from=config.base_url, to='') }}">
</head>
<body>
  {% include "partials/header.html" %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% include "partials/footer.html" %}
  <script>
    (() => {
      const vids = document.querySelectorAll("video.lazy-video[data-src]");
      if (!vids.length) return;
      const play = (v) => {
        if (v.dataset.loaded) return;
        v.dataset.loaded = "1";
        v.src = v.dataset.src;
        v.load();
        v.play().catch(() => {});
      };
      if (!("IntersectionObserver" in window)) {
        vids.forEach(play);
        return;
      }
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            play(e.target);
            io.unobserve(e.target);
          }
        });
      }, { rootMargin: "100px" });
      vids.forEach((v) => io.observe(v));
    })();
  </script>
</body>
</html>
